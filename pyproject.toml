[project]
name = "high-load-etl-validation"
version = "0.1.0"
description = "Bounded multi-source ETL and data quality gates with Python and SQLite"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
