name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: 24-source generated benchmark smoke test
        run: |
          python -m etl_lab generate demo --sources 24 --rows 1000
          python -m etl_lab ingest demo/manifest.json run/events.sqlite --workers 4 --batch-size 500 --max-reject-percent 2
          python -m etl_lab report run/events.sqlite
